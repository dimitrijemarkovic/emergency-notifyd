# zlog configuration for emergency-notifyd / emergency-siren-service /
# emergency-led-service / emergency-mqtt-service.
#
# Log output path: currently /tmp/emergency-logs/, used for on-board testing.
# This directory must match EMERGENCY_ZLOG_LOG_DIR in
# libs/log/src/log_backend_zlog.c, which creates it before zlog_init() runs.
#
# PRODUCTION PATH: NOT YET DECIDED. /var/log is a symlink to /var/volatile/log
# on this Yocto image (tmpfs, wiped on reboot) -- moving these logs under
# /var/log/emergency/ would NOT make them persistent. A persistent partition
# (e.g. something under /data) needs to be confirmed on the actual i.MX93
# board before this path is finalized.

[global]
strict init = true
buffer min = 1024
buffer max = 2MB

[formats]
default = "%d(%Y-%m-%d %H:%M:%S) %-5V [%c] %m%n"

[rules]
notifyd.*   "/tmp/emergency-logs/notifyd.log", 1MB * 5 ~ "notifyd.log.#r"
siren.*     "/tmp/emergency-logs/siren.log", 1MB * 5 ~ "siren.log.#r"
led.*       "/tmp/emergency-logs/led.log", 1MB * 5 ~ "led.log.#r"
mqtt.*      "/tmp/emergency-logs/mqtt.log", 1MB * 5 ~ "mqtt.log.#r"
