# zlog configuration for emergency-notifyd / emergency-siren-service /
# emergency-led-service / emergency-mqtt-service.
#
# Log output path: the board's persistent data partition. This directory must
# match EMERGENCY_ZLOG_LOG_DIR in libs/log/src/log_backend_zlog.c, which
# creates it before zlog_init() runs.
#
# Why not /tmp or /var/log: on this image the root filesystem is mounted
# read-only, /var/log is a symlink into /var/volatile, and both /tmp and
# /var/volatile are tmpfs -- logs written there are gone after a reboot.
# Partition mmcblk0p9, label "data", is ext4 and writable, and a file written
# under it was verified to survive a restart on the target board.

[global]
strict init = true
buffer min = 1024
buffer max = 2MB

[formats]
default = "%d(%Y-%m-%d %H:%M:%S) %-5V [%c] %m%n"

[rules]
notifyd.*   "/run/media/data-mmcblk0p9/emergency/logs/notifyd.log", 1MB * 5 ~ "notifyd.log.#r"
siren.*     "/run/media/data-mmcblk0p9/emergency/logs/siren.log", 1MB * 5 ~ "siren.log.#r"
led.*       "/run/media/data-mmcblk0p9/emergency/logs/led.log", 1MB * 5 ~ "led.log.#r"
mqtt.*      "/run/media/data-mmcblk0p9/emergency/logs/mqtt.log", 1MB * 5 ~ "mqtt.log.#r"
